name: Signed release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: >-
          python -c 'import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"];
          assert os.environ["GITHUB_REF_NAME"] == "v" + version'
      - name: Require tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: python -m pip install '.[dev]' pip-audit build uv==0.11.12
      - run: uv lock --check
      - run: python -m pip_audit --strict .
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: python -m build --sdist --wheel
      - run: docker build --tag local-llm-optimizer:release .
      - name: Scan release image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: local-llm-optimizer:release
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Generate release image SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: local-llm-optimizer:release
          format: cyclonedx
          output: dist/optimizer-image.cdx.json
      - name: Record release checksums
        run: sha256sum dist/*.whl dist/*.tar.gz dist/*.json > dist/SHA256SUMS
      - name: Sign provenance for packages and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-artifacts
          path: dist/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
