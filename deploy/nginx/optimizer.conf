# Include this file from nginx's http context after replacing the domain and certificate paths.
limit_req_zone $binary_remote_addr zone=optimizer_per_ip:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=optimizer_connections:10m;

server {
    listen 80;
    server_name optimizer.example.com;
    return 301 https://optimizer.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name optimizer.example.com;
    ssl_certificate /etc/letsencrypt/live/optimizer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optimizer.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=optimizer_per_ip burst=10 nodelay;
    limit_conn optimizer_connections 10;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Optimizer-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
