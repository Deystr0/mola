services:
  optimizer:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPTIMIZER_API_KEY: "${OPTIMIZER_API_KEY:?Set OPTIMIZER_API_KEY in .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
    volumes:
      - ./docker/optimizer.yaml:/config/optimizer.yaml:ro
      - optimizer-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  optimizer-data:
